name: Daily Quiz

on:
  schedule:
    # التوقيت UTC. دمشق = UTC+3 → 09:07 و 13:07 و 18:07 بتوقيت دمشق
    - cron: "7 6 * * *"
    - cron: "7 10 * * *"
    - cron: "7 15 * * *"
  workflow_dispatch:   # يسمح بالتشغيل اليدوي للتجربة

permissions:
  contents: write      # حتى يحفظ state.json (الأسئلة اللي انتشرت)

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Post one quiz
        run: python bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}

      - name: Save state
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "nothing to commit"
          git pull --rebase
          git push
